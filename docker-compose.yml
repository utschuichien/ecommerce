services:
  # 1. Cơ sở dữ liệu MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: commerce_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Vui lòng cấu hình MYSQL_ROOT_PASSWORD trong file .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-commerce_os}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - commerce_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 2. Redis Cache & Job Queue (BullMQ)
  redis:
    image: redis:7-alpine
    container_name: commerce_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - commerce_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Backend API (NestJS + Prisma)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: commerce_api
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-commerce_os}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Vui lòng cấu hình JWT_ACCESS_SECRET trong file .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Vui lòng cấu hình JWT_REFRESH_SECRET trong file .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?Vui lòng cấu hình COOKIE_SECRET trong file .env}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "3001:3001"
    networks:
      - commerce_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Frontend Web (Next.js 16 Standalone)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
    container_name: commerce_web
    restart: unless-stopped
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    networks:
      - commerce_network
    depends_on:
      - api

volumes:
  mysql_data:
    name: commerce_mysql_data
  redis_data:
    name: commerce_redis_data

networks:
  commerce_network:
    name: commerce_network
    driver: bridge
