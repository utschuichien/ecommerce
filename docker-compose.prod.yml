# Kế thừa docker-compose.yml và bổ sung Nginx Reverse Proxy
services:
  nginx:
    image: nginx:alpine
    container_name: commerce_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - commerce_network

