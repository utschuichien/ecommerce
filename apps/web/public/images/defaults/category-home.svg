<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="homeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="homeShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#92400E" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="36" fill="url(#homeBg)" stroke="#FCD34D" stroke-width="3"/>

  <g filter="url(#homeShadow)">
    <!-- House Roof and Base -->
    <path d="M128 56L58 116C54 119 56 126 62 126H68V196C68 202 73 207 79 207H177C183 207 188 202 188 196V126H194C200 126 202 119 198 116L128 56Z" fill="#FFFFFF"/>
    <path d="M128 56L58 116C54 119 56 126 62 126H68L128 74L188 126H194C200 126 202 119 198 116L128 56Z" fill="url(#houseGrad)"/>

    <!-- Chimney -->
    <path d="M164 74V62C164 59 167 56 170 56H178C181 56 184 59 184 62V92L164 74Z" fill="url(#houseGrad)"/>

    <!-- Cozy Window with Light -->
    <rect x="86" y="138" width="32" height="32" rx="6" fill="#FEF08A" stroke="#F59E0B" stroke-width="2"/>
    <path d="M102 138V170M86 154H118" stroke="#F59E0B" stroke-width="2"/>

    <!-- Potted Plant in Front -->
    <g transform="translate(138, 142)">
      <!-- Pot -->
      <path d="M12 36L16 62H36L40 36H12Z" fill="#EA580C"/>
      <!-- Leaves -->
      <path d="M26 36C26 20 10 14 6 12C6 24 16 36 26 36Z" fill="url(#plantGrad)"/>
      <path d="M26 36C26 16 42 10 46 8C46 20 36 36 26 36Z" fill="url(#plantGrad)"/>
      <path d="M26 36C26 10 32 4 26 0C20 4 26 22 26 36Z" fill="#34D399"/>
