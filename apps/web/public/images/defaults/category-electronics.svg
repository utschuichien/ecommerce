<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="elecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="elecShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E40AF" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="36" fill="url(#elecBg)" stroke="#BFDBFE" stroke-width="3"/>

  <g filter="url(#elecShadow)">
    <!-- Laptop in background -->
    <rect x="52" y="90" width="106" height="68" rx="8" fill="url(#laptopGrad)"/>
    <rect x="58" y="96" width="94" height="54" rx="4" fill="#0F172A"/>
    <!-- Laptop screen glow content -->
    <path d="M68 116L86 134L118 108" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Laptop base -->
    <path d="M40 158H170C174 158 178 162 176 166L172 170H38L34 166C32 162 36 158 40 158Z" fill="#94A3B8"/>

    <!-- Smartphone in foreground -->
    <rect x="136" y="80" width="62" height="114" rx="14" fill="url(#phoneGrad)" stroke="#FFFFFF" stroke-width="3.5"/>
    <!-- Phone Screen -->
    <rect x="142" y="92" width="50" height="88" rx="8" fill="#1E293B"/>
    <!-- Notch / Camera -->
    <rect x="157" y="84" width="20" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.6"/>
    <!-- Screen content -->
    <circle cx="167" cy="124" r="14" fill="#38BDF8" fill-opacity="0.25"/>
    <path d="M161 124L165 128L173 120" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="150" y="146" width="34" height="5" rx="2.5" fill="#60A5FA"/>
    <rect x="154" y="156" width="26" height="4" rx="2" fill="#93C5FD"/>
    <!-- Home bar -->
    <rect x="157" y="186" width="20" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.6"/>
  </g>
</svg>