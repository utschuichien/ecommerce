<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sportBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="dumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shoeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="sportShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#065F46" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="36" fill="url(#sportBg)" stroke="#BBF7D0" stroke-width="3"/>

  <g filter="url(#sportShadow)">
    <!-- Dumbbell (Background angle) -->
    <g transform="translate(128, 110) rotate(-28)">
      <rect x="-60" y="-8" width="120" height="16" rx="6" fill="#94A3B8"/>
      <!-- Weights Left -->
      <rect x="-84" y="-32" width="26" height="64" rx="8" fill="url(#dumbGrad)"/>
      <rect x="-94" y="-24" width="12" height="48" rx="4" fill="#065F46"/>
      <!-- Weights Right -->
      <rect x="58" y="-32" width="26" height="64" rx="8" fill="url(#dumbGrad)"/>
      <rect x="82" y="-24" width="12" height="48" rx="4" fill="#065F46"/>
    </g>

    <!-- Sneaker / Running Shoe in Foreground -->
    <g transform="translate(56, 116)">
      <!-- Sole -->
      <path d="M12 62C28 62 48 68 84 68C124 68 136 60 144 54V68C144 74 138 80 130 80H16C10 80 6 74 6 68V64C6 63 9 62 12 62Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
      <!-- Upper Shoe Body -->
      <path d="M12 62C24 48 44 42 64 42H88L112 18C116 14 124 16 128 22L138 42C142 46 144 50 144 54C136 60 124 68 84 68C48 68 28 62 12 62Z" fill="url(#shoeGrad)"/>
      <!-- Accent Stripe / Swoosh -->
      <path d="M42 56C62 56 94 44 116 32" stroke="#FEF08A" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Laces -->
      <path d="M86 38L98 42M94 30L106 34" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>