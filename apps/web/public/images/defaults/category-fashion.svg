<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
    <linearGradient id="hangerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="fashShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#9F1239" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="36" fill="url(#fashBg)" stroke="#FECDD3" stroke-width="3"/>

  <g filter="url(#fashShadow)">
    <!-- Clothing Hanger -->
    <path d="M128 62C128 54 134 48 142 48C150 48 156 54 156 62C156 68 150 74 142 74H128V84L68 114C62 117 64 126 71 126H185C192 126 194 117 188 114L128 84V62Z" stroke="url(#hangerGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Shopping Tote Bag -->
    <rect x="74" y="118" width="108" height="92" rx="14" fill="url(#bagGrad)"/>
    <!-- Bag Handles -->
    <path d="M102 118V100C102 88 114 80 128 80C142 80 154 88 154 100V118" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <!-- Bag Ribbon / Star accent -->
    <path d="M128 144L132 154L142 155L134 162L136 172L128 166L120 172L122 162L114 155L124 154L128 144Z" fill="#FFFFFF"/>
