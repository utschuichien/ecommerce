<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="custBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="50%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="custBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="custSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="custHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="custShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4338CA" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="128" cy="128" r="128" fill="url(#custBg)"/>

  <!-- Subtle Inner Ring -->
  <circle cx="128" cy="128" r="124" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6"/>

  <g filter="url(#custShadow)">
    <!-- Shoulders & Body / Clothes -->
    <path d="M52 232C52 194.444 82.444 164 120 164H136C173.556 164 204 194.444 204 232V256H52V232Z" fill="url(#custBody)"/>

    <!-- Shirt Collar / Neck Opening -->
    <path d="M112 164L128 184L144 164H112Z" fill="url(#custSkin)"/>
    <path d="M128 184V204" stroke="#E0E7FF" stroke-width="3" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="114" y="132" width="28" height="36" rx="6" fill="url(#custSkin)"/>

    <!-- Head Face -->
    <ellipse cx="128" cy="104" rx="42" ry="46" fill="url(#custSkin)"/>

    <!-- Hair Back/Top -->
    <path d="M84 102C84 66 102 50 128 50C156 50 172 66 172 102C172 108 168 114 162 110C154 94 146 88 128 88C110 88 100 96 94 110C88 114 84 108 84 102Z" fill="url(#custHair)"/>

    <!-- Cheerful Expression: Eyes & Smile -->
    <circle cx="112" cy="106" r="4.5" fill="#1E1B4B"/>
    <circle cx="144" cy="106" r="4.5" fill="#1E1B4B"/>
    <!-- Subtle smile -->
    <path d="M120 122C124 126 132 126 136 122" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="103" cy="116" rx="6" ry="3" fill="#FB7185" fill-opacity="0.35"/>
    <ellipse cx="153" cy="116" rx="6" ry="3" fill="#FB7185" fill-opacity="0.35"/>
  </g>

  <!-- Verified Customer Mini Badge Accent -->
  <g transform="translate(182, 182)">
    <circle cx="20" cy="20" r="20" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M12 20L18 26L28 14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>